name: CI/CD AKS

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes manifests
        run: kubectl kustomize k8s/overlays/production > /tmp/cantina-rendered.yaml

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Validate container build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Build, publish and deploy
    needs: ci
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CORE_OUTPUT: none
      IMAGE_REPOSITORY: cantina
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to Azure with GitHub OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve ACR image
        id: image
        shell: bash
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: |
          set -euo pipefail
          login_server="$(az acr show --name "$ACR_NAME" --query loginServer --output tsv)"
          echo "registry=$login_server" >> "$GITHUB_OUTPUT"
          echo "name=$login_server/$IMAGE_REPOSITORY" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR
        env:
          ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
        run: az acr login --name "$ACR_NAME"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and publish immutable image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up kubelogin
        uses: azure/use-kubelogin@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          kubelogin-version: v0.2.18

      - name: Configure AKS access
        env:
          RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AKS_CLUSTER: ${{ vars.AZURE_AKS_CLUSTER }}
        run: az aks get-credentials --resource-group "$RESOURCE_GROUP" --name "$AKS_CLUSTER" --overwrite-existing

      - name: Apply runtime secrets
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DB_PASSWORD"
          test -n "$MYSQL_ROOT_PASSWORD"
          test -n "$JWT_SECRET"
          test -n "$ADMIN_USERNAME"
          test -n "$ADMIN_PASSWORD"
          admin_username_b64="$(printf '%s' "$ADMIN_USERNAME" | base64 -w0)"
          admin_password_b64="$(printf '%s' "$ADMIN_PASSWORD" | base64 -w0)"
          kubectl -n cantina create secret generic cantina-secrets \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=ADMIN_USERNAME_B64="$admin_username_b64" \
            --from-literal=ADMIN_PASSWORD_B64="$admin_password_b64" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to AKS
        shell: bash
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAG: ${{ github.sha }}
          APP_HOST: ${{ vars.APP_HOST }}
        run: |
          set -euo pipefail
          sed -i "s|newName: .*|newName: ${IMAGE_NAME}|" k8s/overlays/production/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" k8s/overlays/production/kustomization.yaml

          if [ -n "$APP_HOST" ]; then
            if ! [[ "$APP_HOST" =~ ^([a-zA-Z0-9]([a-zA-Z0-9-]{0,61}[a-zA-Z0-9])?\.)+[a-zA-Z]{2,63}$ ]]; then
              echo "APP_HOST no es un nombre DNS valido" >&2
              exit 1
            fi
            sed -i "s|    - http:|    - host: ${APP_HOST}\n      http:|" k8s/overlays/production/ingress.yaml
          fi

          kubectl apply -k k8s/overlays/production
          kubectl -n cantina rollout status statefulset/mysql --timeout=10m
          kubectl -n cantina rollout status deployment/cantina --timeout=10m
          kubectl -n cantina get ingress cantina
