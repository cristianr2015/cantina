apiVersion: apps/v1
kind: Deployment
metadata:
  name: cantina
  labels:
    app.kubernetes.io/name: cantina
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cantina
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cantina
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: seed-uploads
          image: cantina-app:latest
          command: ["sh", "-c", "cp -an /app/public/uploads/. /uploads/ || true"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /uploads
      containers:
        - name: app
          image: cantina-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          envFrom:
            - configMapRef:
                name: cantina-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cantina-secrets
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: cantina-secrets
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: uploads
              mountPath: /app/public/uploads
      terminationGracePeriodSeconds: 15
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: cantina-uploads
