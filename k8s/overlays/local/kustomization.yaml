apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - mysql-local-service.yaml
images:
  - name: cantina-app
    newName: cantina-app
    newTag: local
patches:
  - target:
      group: ""
      version: v1
      kind: Service
      name: cantina
    patch: |-
      - op: add
        path: /spec/type
        value: LoadBalancer
      - op: replace
        path: /spec/ports/0/port
        value: 3000
