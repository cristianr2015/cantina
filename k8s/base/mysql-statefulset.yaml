apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cantina-mysql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cantina-mysql
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mysql
          image: mysql:8.4.8
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MYSQL_DATABASE
              value: cantina_db
            - name: MYSQL_USER
              value: cantina
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cantina-secrets
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cantina-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: ADMIN_USERNAME_B64
              valueFrom:
                secretKeyRef:
                  name: cantina-secrets
                  key: ADMIN_USERNAME_B64
            - name: ADMIN_PASSWORD_B64
              valueFrom:
                secretKeyRef:
                  name: cantina-secrets
                  key: ADMIN_PASSWORD_B64
          startupProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"${MYSQL_ROOT_PASSWORD}\""]
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"${MYSQL_ROOT_PASSWORD}\""]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot --password=\"${MYSQL_ROOT_PASSWORD}\""]
            periodSeconds: 20
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
      volumes:
        - name: initdb
          configMap:
            name: mysql-init
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
