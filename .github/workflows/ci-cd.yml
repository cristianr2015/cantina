name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.name }}
      tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static checks
        run: npm test

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate Kubernetes render
        run: kubectl kustomize k8s/overlays/production > /tmp/cantina-rendered.yaml

      - name: Resolve image name
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build container image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    name: Deploy to Kubernetes
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.K8S_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure cluster access
        shell: bash
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s' "$KUBE_CONFIG_B64" | base64 --decode > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
          kubectl cluster-info

      - name: Apply runtime secrets
        shell: bash
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          admin_username_b64="$(printf '%s' "$ADMIN_USERNAME" | base64 -w0)"
          admin_password_b64="$(printf '%s' "$ADMIN_PASSWORD" | base64 -w0)"
          kubectl -n cantina create secret generic cantina-secrets \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=MYSQL_ROOT_PASSWORD="$MYSQL_ROOT_PASSWORD" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=ADMIN_USERNAME_B64="$admin_username_b64" \
            --from-literal=ADMIN_PASSWORD_B64="$admin_password_b64" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy manifests
        shell: bash
        env:
          APP_HOST: ${{ vars.APP_HOST }}
          IMAGE_NAME: ${{ needs.build.outputs.image }}
          IMAGE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          sed -i "s|newName: .*|newName: ${IMAGE_NAME}|" k8s/overlays/production/kustomization.yaml
          sed -i "s|newTag: .*|newTag: ${IMAGE_TAG}|" k8s/overlays/production/kustomization.yaml
          if [ -n "$APP_HOST" ]; then
            sed -i "s|host: cantina.example.com|host: ${APP_HOST}|" k8s/overlays/production/ingress.yaml
          fi
          kubectl apply -k k8s/overlays/production
          kubectl -n cantina rollout status statefulset/mysql --timeout=5m
          kubectl -n cantina rollout status deployment/cantina --timeout=5m
